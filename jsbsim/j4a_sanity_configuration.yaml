  gamma_tracking_absolute_deg: 0.5
  normalized_control_surface_usage_max: 0.90
  cold_start_repeatability_relative_approx: 0.01
  zero_wind_residual_fps: 1.0e-9
  require_gamma_vertical_speed_sign_consistency: true
  require_altitude_evolution_sign_consistency: true
  require_climb_throttle_above_level: true
  require_descent_throttle_below_level: true
  afterburner_off_max_throttle_position_norm: 1.0
  capability_overprediction_allowed: false

