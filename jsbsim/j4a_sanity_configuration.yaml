simulation:
  timestep_s: 0.008333333333333333
  replay_duration_s: 30.0
  steady_measurement_window_s: 20.0
  latest_acceptable_settling_time_s: 10.0
  gamma_target_ramp_s: 3.0

outer_loop_sanity_controller:
  interpretation: test_harness_only_not_planner_or_aircraft_capability_policy
  gamma:
    proportional_elevator_cmd_per_deg: -0.040
    integral_elevator_cmd_per_deg_s: -0.006
    integral_limit_deg_s: 20.0
    elevator_cmd_min_norm: -0.30
    elevator_cmd_max_norm: 0.30
  cas:
    proportional_throttle_cmd_per_knot: 0.004
    integral_throttle_cmd_per_knot_s: 0.0005
    integral_limit_knot_s: 100.0
    throttle_cmd_min_norm: 0.0
