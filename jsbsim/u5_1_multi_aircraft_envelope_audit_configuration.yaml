schema_version: 1
configuration_id: u5_1_existing_data_envelope_audit_v1
parent_stage: U5
parent_provenance_id: u5-4135baabef4a403315e5

candidate_order: [c172r, c172p, c172x, c182, DHC6, J3Cub, pa28, c310]
ideal_comparison_altitudes_m: [0, 1000, 2000, 3000, 4000, 5000, 5500, 6000]
display_speed_columns_mps: [30, 40, 50, 60]

cell_classification:
  USABLE: actual stable response, strict VALID, no controller saturation, and throttle below caution threshold
  MARGINAL: actual stable response with strict UNKNOWN/INFEASIBLE, controller saturation, or low power margin
  UNUSABLE: tested but actual stable response contract failed
  NOT_TESTED: no U5 straight point exists at the exact altitude and IAS
  throttle_caution_threshold_norm: 0.98

selection_priority_order:
  - stability_and_control_quality
  - repeatability
  - usable_altitude_speed_coverage
  - minimum_tuning
  - reasonable_turn_climb_descent
  - uav_like_fixed_wing_character
  - mentor_numeric_proximity

policy:
  existing_u5_data_first: true
  mentor_values_are_hard_gates: false
  new_run_only_for_missing_critical_selection_cell: true
  critical_primary_backup_cells_already_present: true
  new_simulation_required: false

scope:
  add_new_candidate: false
  full_u5_rerun: false
  full_lut_generation: false
  controller_tuning: false
  aircraft_xml_modification: false
  planner_or_search_modification: false
  maximum_bank_search: false
  maximum_climb_search: false
  service_ceiling_search: false
  fine_boundary_search: false
  next_stage_started: false

source_artifacts:
  u5_phase1: results/u5_phase1_speed_screen.json
  u5_high_altitude: results/u5_high_altitude_screen.json
  u5_comparison: results/u5_candidate_comparison.json
  u5_freeze: results/u5_aircraft_freeze.json
  u5_points: results/u5_points.json
  u5_runs: results/u5_runs.json
  u5_provenance: results/u5_provenance.json
  u5_result: results/u5_result.json
