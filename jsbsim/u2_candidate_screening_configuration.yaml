fixture_common:
  representative_altitude_msl_m: 1000.0
  synthetic_terrain_elevation_msl_m: -1000.0
  fuel_frozen: true
  flap_command_norm: 0.0
  flap_position_norm: 0.0
  propeller_advance_command_norm: 1.0
  feather_command_norm: 0.0
  mixture_command_norm: 1.0
  initial_symmetric_throttle_command_norm: 0.5
  atmosphere: US_Standard
  delta_temperature_R: 0.0
  wind_north_fps: 0.0
  wind_east_fps: 0.0
  wind_down_fps: 0.0
  gust_north_fps: 0.0
  gust_east_fps: 0.0
  gust_down_fps: 0.0
  turbulence_type: 0

simulation:
  timestep_s: 0.01
  replay_duration_s: 40.0
  steady_measurement_window_s: 20.0
  target_ramp_s: 8.0
  cold_start_repetitions: 3

gates:
  speed:
    - {maneuver: straight, ias_mps: 40.0, target_value: 0.0}
    - {maneuver: straight, ias_mps: 35.0, target_value: 0.0}
  climb:
    - {maneuver: vertical, ias_mps: 40.0, target_value: 5.0}
  turn:
    - {maneuver: turn, ias_mps: 35.0, target_value: 25.0}
    - {maneuver: turn, ias_mps: 35.0, target_value: -25.0}

ranking:
  maximum_selected: 2
  priority_order:
    - speed_fit
    - climb_power_margin
    - turn_fit
    - saturation_margin
    - native_model_quality
    - initialization_reproducibility
    - model_simplicity
    - generic_uav_profile_fit
