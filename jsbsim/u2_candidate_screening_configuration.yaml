schema_version: 1
configuration_id: u2_stock_candidate_screening_v1
parent_validation: u1_profile_validation_configuration.yaml

scope:
  stock_inventory_only: true
  candidate_discovery_only: true
  controller_tuning: false
  aircraft_xml_modification: false
  full_altitude_sweep: false
  capability_boundary_sweep: false
  planner_integration: false
  next_architecture_implementation: false

operational_profile:
  ias_range_mps: [35.0, 50.0]
  nominal_ias_mps: 40.0
  maximum_absolute_bank_deg: 25.0
  maximum_absolute_vertical_speed_mps: 5.0
  values_are_aircraft_physical_limits: false
  values_are_planner_operational_constraints: true

static_filter:
  default_for_unclassified_powered_fixed_wing: KEEP_UNCERTAIN
  reject_groups:
    non_fixed_wing: [ah1s, ball, ballx, F450, mk82, paraglider, Submarine_Scout, weather-balloon, ZLT-NT]
    glider_or_unpowered: [minisgs, SGS, sgs126, sgs233]
    spacecraft_or_experimental_lifting_body: [J246, Shuttle, X15, x24b]
    jet_or_high_speed_tactical: [A4, f104, f15, f22, F4N, F80C, p51d, T37, T38, XB-70]
    airliner_or_large_transport: ['737', 787-8, A320, B17, B747, Boeing314, C130, Concorde, fokker100, fokker50, global5000, MD11, Short_S23]
    incompatible_special_configuration: [blank, pogo-jsbsim, Pterosaur, wrightFlyer1903]
    metadata_speed_mismatch: [pc7, t6texan2]
    prior_u1_decision: [DHC6, c182]
  reasons:
    non_fixed_wing: non_fixed_wing_or_buoyant_ballistic_configuration
    glider_or_unpowered: propulsion_requirement_incompatible
    spacecraft_or_experimental_lifting_body: spacecraft_or_rocket_lifting_body_configuration
    jet_or_high_speed_tactical: jet_or_high_speed_tactical_configuration_mismatched_to_35_50_mps_profile
    airliner_or_large_transport: size_speed_or_mission_configuration_obviously_mismatched_to_profile
    incompatible_special_configuration: placeholder_vtol_dummy_or_historically_too_slow_special_configuration
    metadata_speed_mismatch: declared_or_configuration_implied_clean_minimum_speed_above_35_mps
    prior_u1_decision: prior_u1_rejection_or_not_promising_result_no_retest

