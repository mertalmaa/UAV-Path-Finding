  full_lut_generation: false
  boundary_refinement: false
  maximum_bank_search: false
  service_ceiling_research: false
  controller_gain_tuning: false
  stock_xml_modification: false
  planner_modification: false
  interpolation: false
  derating: false
  heading_addition: false
  final_replay_implementation: false

selection_philosophy:
  mentor_speed_reference_mps: [35.0, 50.0]
  mentor_bank_reference_deg: 25.0
  mentor_vertical_speed_reference_mps: 5.0
  mentor_values_are_hard_gates: false
  required_character: low_or_medium_speed_stable_predictable_non_aggressive_fixed_wing
  priority_order:
    - control_quality_and_stability
    - repeatability
    - high_altitude_usability
    - minimum_tuning_burden
    - reasonable_turn_climb_descent
    - uav_like_speed_and_behavior
    - mentor_reference_proximity

candidates:
  c172r: {fixture_source: u2, mixture_mode: production_pressure_ratio_v1, mixture_policy_id: c172r-production-mixture-pressure-ratio-v1, added_from_inventory: false}
  c172p: {fixture_source: u2, mixture_mode: production_pressure_ratio_v1, mixture_policy_id: c172p-production-mixture-pressure-ratio-v1, added_from_inventory: false}
  c172x: {fixture_source: u2, mixture_mode: stock_automatic, added_from_inventory: false}
