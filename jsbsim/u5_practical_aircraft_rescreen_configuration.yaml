phase1:
  altitudes_m: [0, 3000]
  initial_speed_probes_mps: [30, 40, 50, 60]
  adaptive_extra_probe_low_mps: 25
  adaptive_extra_probe_high_mps: 70
  maximum_selected_speeds_per_aircraft: 1
  early_reject_if_no_stable_speed_at_both_altitudes: true

phase2:
  altitudes_m: [5000, 5500, 6000]
  turn_bank_targets_deg: [-20, 20, -30, 30]
  vertical_speed_targets_mps: [-4.5, -2.5, 2.5, 4.5]
  straight_first: true
  skip_maneuvers_if_straight_actual_stability_unusable: true

simulation:
  timestep_s: 0.01
  replay_duration_s: 40.0
  steady_measurement_window_s: 20.0
  target_ramp_s: 8.0
  cold_start_repetitions: 3

actual_stable_response_contract:
  ias_mean_relative_error_max: 0.05
  ias_retention_min: 0.90
  straight_vertical_speed_abs_max_mps: 0.75
  bank_mean_error_max_deg: 3.0
  vertical_mean_error_max_mps: 0.80
  minimum_meaningful_turn_bank_deg: 15.0
  minimum_meaningful_vertical_response_mps: 0.75
  normalized_surface_usage_max: 0.90
  measurement_ias_std_max_mps: 0.50
  measurement_bank_std_max_deg: 1.00
  measurement_vertical_speed_std_max_mps: 0.50
  settling_deadline_s: 30.0
  repeatability_required: true
  engine_health_required: true
  strict_u1_status_is_only_one_input: true
  unknown_is_infeasible: false

